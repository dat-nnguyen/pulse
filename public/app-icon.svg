<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Pulse Waveform Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#00D2DF"/>
      <stop offset="75%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Radial Glow Behind Waveform -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2DF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00D2DF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00D2DF" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Shape (Full 512x512 Squircle with standard macOS 115px corner radius) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Ambient Glow in Center -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Concentric Sound Stage Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0, 210, 223, 0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 210, 223, 0.04)" stroke-width="2"/>

  <!-- Centered Iconic Pulse Waveform -->
  <path d="M 80 256 
           H 150 
           L 190 150 
           L 245 370 
           L 295 190 
           L 340 310 
           L 370 256 
           H 432"
        stroke="url(#pulseGrad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)"/>

  <!-- Accent Peak Dots -->
  <circle cx="190" cy="150" r="7" fill="#00F5FF"/>
  <circle cx="245" cy="370" r="7" fill="#00D2DF"/>
  <circle cx="295" cy="190" r="7" fill="#06B6D4"/>
  <circle cx="340" cy="310" r="7" fill="#3B82F6"/>
</svg>
